<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal — 25 for '25</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>25 for '25 — Reveal</h1>
    <div class="whoami"><a href="rank.html">&larr; Back to ranking</a></div>
  </header>

  <main id="app">
    <p id="loading">Loading…</p>

    <div id="reveal-view" class="hidden">
      <p class="abstained-note" id="abstained-note"></p>

      <section class="stats-panel" id="stats-panel"></section>

      <section>
        <h2>Side by side</h2>
        <p class="hint">Click a row for director, cast, and Oscar detail.</p>
        <div class="table-wrap">
          <table id="compare-table">
            <thead>
              <tr>
                <th data-sort="combined_rank">New Rank</th>
                <th data-sort="title">Title</th>
                <th data-sort="andrew_rank">Andrew</th>
                <th data-sort="amelia_rank">Amelia</th>
                <th data-sort="delta">Delta</th>
                <th data-sort="big_picture_rank">Big Picture</th>
                <th data-sort="big_picture_delta">Δ vs BP</th>
              </tr>
            </thead>
            <tbody id="compare-body"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>Biggest disagreements (delta &gt; 5)</h2>
        <div id="diff-panel"></div>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let revealData = null;
    let sortKey = 'combined_rank';
    let sortAsc = true;

    async function init() {
      let data;
      try {
        data = await apiGet('reveal');
      } catch (err) {
        document.getElementById('loading').textContent =
          'Could not reach the backend — check WEB_APP_URL in config.js. (' + err.message + ')';
        return;
      }
      document.getElementById('loading').classList.add('hidden');
      revealData = data;
      document.getElementById('reveal-view').classList.remove('hidden');
      renderAbstained();
      renderStats();
      renderTable();
      renderDiffPanel();
      document.querySelectorAll('#compare-table th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.dataset.sort;
          if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
          renderTable();
        });
      });
    }

    function renderAbstained() {
      if (revealData.abstained) {
        document.getElementById('abstained-note').textContent =
          revealData.abstained.note + ' (' + revealData.abstained.title + ')';
      }
    }

    function statCard(label, valueHtml) {
      return '<div class="stat"><span class="stat-label">' + label + '</span>' + valueHtml + '</div>';
    }

    function eraLeanValue(year) {
      if (year == null) return '<span class="stat-value">—</span>';
      return '<span class="stat-value">' + year + '</span>';
    }

    function genreLeanValue(lean) {
      if (lean == null) return '<span class="stat-value">—</span>';
      return '<span class="stat-value">' + escapeHtml(lean.genre) + ' <span class="stat-sub">(avg #' + lean.avg_rank.toFixed(1) + ')</span></span>';
    }

    function genderLeanValue(lean) {
      if (lean == null) return '<span class="stat-value">—</span>';
      var bits = [];
      if (lean.male_avg_rank != null) bits.push('male avg #' + lean.male_avg_rank.toFixed(1));
      if (lean.female_avg_rank != null) bits.push('female avg #' + lean.female_avg_rank.toFixed(1));
      var label = lean.lean === 'even' ? 'Even split' : lean.lean === 'male' ? 'Leans male-led' : 'Leans female-led';
      return '<span class="stat-value">' + label + ' <span class="stat-sub">(' + bits.join(' · ') + ')</span></span>';
    }

    function renderStats() {
      const s = revealData.stats;
      const panel = document.getElementById('stats-panel');
      const waiting = '<span class="stat-value stat-waiting">Waiting on both…</span>';
      panel.innerHTML =
        statCard('Andrew&rsquo;s #1', '<span class="stat-value">' + (s.andrew_number_one ? escapeHtml(s.andrew_number_one) : '—') + '</span>') +
        statCard('Amelia&rsquo;s #1', '<span class="stat-value">' + (s.amelia_number_one ? escapeHtml(s.amelia_number_one) : '—') + (s.same_number_one ? ' 🎯 same pick!' : '') + '</span>') +
        statCard('Agreement rate', s.agreement_rate ? '<span class="stat-value">' + s.agreement_rate.count + '/' + s.agreement_rate.total + ' <span class="stat-sub">within 2 spots</span></span>' : waiting) +
        statCard('Biggest shared love', s.biggest_shared_love ? '<span class="stat-value">' + escapeHtml(s.biggest_shared_love.title) + '</span>' : waiting) +
        statCard('Biggest shared hate', s.biggest_shared_hate ? '<span class="stat-value">' + escapeHtml(s.biggest_shared_hate.title) + '</span>' : waiting) +
        statCard('Biggest disagreement', s.biggest_disagreement ? '<span class="stat-value">' + escapeHtml(s.biggest_disagreement.title) + ' (Δ' + s.biggest_disagreement.delta + ')</span>' : waiting) +
        statCard('Biggest Big Picture snub', s.biggest_snub ? '<span class="stat-value">' + escapeHtml(s.biggest_snub.title) + ' <span class="delta-up">+' + s.biggest_snub.big_picture_delta + '</span></span>' : waiting) +
        statCard('Most overrated by Big Picture', s.most_overrated ? '<span class="stat-value">' + escapeHtml(s.most_overrated.title) + ' <span class="delta-down">' + s.most_overrated.big_picture_delta + '</span></span>' : waiting) +
        statCard('Andrew&rsquo;s era lean', eraLeanValue(s.andrew_era_lean)) +
        statCard('Amelia&rsquo;s era lean', eraLeanValue(s.amelia_era_lean)) +
        statCard('Andrew&rsquo;s genre lean', genreLeanValue(s.andrew_genre_lean)) +
        statCard('Amelia&rsquo;s genre lean', genreLeanValue(s.amelia_genre_lean)) +
        statCard('Andrew&rsquo;s gender lean', genderLeanValue(s.andrew_gender_lean)) +
        statCard('Amelia&rsquo;s gender lean', genderLeanValue(s.amelia_gender_lean));
    }

    function formatDelta(d) {
      if (d == null) return '—';
      if (d > 0) return '<span class="delta-up">+' + d + '</span>';
      if (d < 0) return '<span class="delta-down">' + d + '</span>';
      return '<span class="delta-flat">0</span>';
    }

    function renderTable() {
      const rows = revealData.movies.slice().sort((a, b) => {
        const av = a[sortKey], bv = b[sortKey];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
        return sortAsc ? cmp : -cmp;
      });
      const body = document.getElementById('compare-body');
      body.innerHTML = '';
      rows.forEach(m => {
        const tr = document.createElement('tr');
        tr.className = 'movie-summary-row';
        tr.innerHTML =
          '<td>' + (m.combined_rank == null ? '—' : m.combined_rank) + '</td>' +
          '<td>' + escapeHtml(m.title) + ' <span class="movie-year">(' + m.year + ')</span></td>' +
          '<td>' + (m.andrew_rank == null ? '—' : m.andrew_rank) + '</td>' +
          '<td>' + (m.amelia_rank == null ? '—' : m.amelia_rank) + '</td>' +
          '<td>' + (m.delta == null ? '—' : m.delta) + '</td>' +
          '<td>#' + m.big_picture_rank + '</td>' +
          '<td>' + formatDelta(m.big_picture_delta) + '</td>';

        const detailTr = document.createElement('tr');
        detailTr.className = 'movie-detail-row hidden';
        const td = document.createElement('td');
        td.colSpan = 7;
        td.innerHTML =
          '<div class="movie-detail">' +
            '<p><strong>Genre:</strong> ' + escapeHtml(m.genre || '—') + '</p>' +
            '<p><strong>Lead:</strong> ' + escapeHtml(m.lead_gender || '—') + '</p>' +
            '<p><strong>Director:</strong> ' + escapeHtml(m.director || '—') + '</p>' +
            '<p><strong>Starring:</strong> ' + escapeHtml(m.cast || '—') + '</p>' +
            '<p><strong>Oscar wins:</strong> ' + escapeHtml(m.oscar_wins || 'none') + '</p>' +
            '<p><strong>Oscar losses:</strong> ' + escapeHtml(m.oscar_losses || 'not nominated') + '</p>' +
            '<p><strong>Best Picture that year:</strong> ' + escapeHtml(m.best_picture_winner || '—') + '</p>' +
          '</div>';
        detailTr.appendChild(td);

        tr.addEventListener('click', () => detailTr.classList.toggle('hidden'));

        body.appendChild(tr);
        body.appendChild(detailTr);
      });
    }

    function renderDiffPanel() {
      const diffs = revealData.movies.filter(m => m.delta > 5).slice().sort((a, b) => b.delta - a.delta);
      const container = document.getElementById('diff-panel');
      if (!diffs.length) {
        container.textContent = 'No big disagreements — pretty aligned!';
        return;
      }
      container.innerHTML = diffs.map(m =>
        '<div class="diff-card">' +
          '<h3>' + escapeHtml(m.title) + ' <span class="movie-year">(' + m.year + ')</span> — Δ' + m.delta + '</h3>' +
          '<p><strong>Andrew (#' + m.andrew_rank + '):</strong> ' + escapeHtml(m.andrew_note || '—') + '</p>' +
          '<p><strong>Amelia (#' + m.amelia_rank + '):</strong> ' + escapeHtml(m.amelia_note || '—') + '</p>' +
        '</div>'
      ).join('');
    }

    init();
  </script>
</body>
</html>
